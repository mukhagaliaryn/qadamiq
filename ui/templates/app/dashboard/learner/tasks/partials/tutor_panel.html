{% comment %}
ИИ-тьютор чат. Подключается на странице задания:
    {% include 'app/dashboard/learner/tasks/partials/tutor_panel.html' %}
Требует в контексте объект `task`.
{% endcomment %}

<section
    class="rounded-3xl bg-white p-6 border border-default"
    x-data="tutorChat({ url: '{% url 'learner:task-tutor' task.id %}', csrf: '{{ csrf_token }}' })"
    x-init="init()"
>
    <div class="flex items-center gap-4">
        <div class="flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl bg-brand text-2xl text-white">
            ✨
        </div>
        <div class="flex-1">
            <h2 class="text-xl font-black text-heading">ИИ-помощник</h2>
            <p class="text-body">Поможет найти ошибку, но не назовёт готовый ответ.</p>
        </div>
        <button
            type="button"
            class="rounded-2xl bg-neutral-primary px-4 py-2 font-bold text-brand border border-default"
            @click="open = !open"
            x-text="open ? 'Свернуть' : 'Открыть'"
        ></button>
    </div>

    <div x-show="open" x-transition class="mt-5">
        <div
            x-ref="log"
            class="grid gap-3 max-h-96 overflow-y-auto pr-1"
        >
            <template x-if="messages.length === 0 && !loading">
                <p class="text-body">
                    Напиши, что тебе непонятно, или нажми «Проверь мою ошибку».
                </p>
            </template>

            <template x-for="(msg, index) in messages" :key="index">
                <div :class="msg.role === 'user' ? 'flex justify-end' : 'flex justify-start'">
                    <div
                        class="max-w-[85%] rounded-2xl px-4 py-3 border border-default"
                        :class="msg.role === 'user' ? 'bg-brand text-white' : 'bg-neutral-primary text-heading'"
                        x-text="msg.content"
                    ></div>
                </div>
            </template>

            <template x-if="loading">
                <div class="flex justify-start">
                    <div class="rounded-2xl bg-neutral-primary px-4 py-3 text-body border border-default">
                        Думаю…
                    </div>
                </div>
            </template>
        </div>

        <template x-if="error">
            <p class="mt-3 text-destructive" x-text="error"></p>
        </template>

        <div class="mt-4 flex flex-wrap gap-2">
            <button
                type="button"
                class="rounded-2xl bg-neutral-primary px-4 py-2 font-bold text-brand border border-default disabled:opacity-40"
                :disabled="loading"
                @click="quick('Проверь, пожалуйста, мою ошибку.')"
            >
                Проверь мою ошибку
            </button>
            <button
                type="button"
                class="rounded-2xl bg-neutral-primary px-4 py-2 font-bold text-brand border border-default disabled:opacity-40"
                :disabled="loading"
                @click="quick('С чего мне начать?')"
            >
                С чего начать?
            </button>
        </div>

        <div class="mt-3 flex items-end gap-3">
            <textarea
                x-model="draft"
                rows="1"
                placeholder="Напиши свой вопрос…"
                class="w-full resize-none rounded-2xl border border-default bg-neutral-primary px-4 py-3 outline-none focus:border-brand"
                @keydown.enter.prevent="sendDraft()"
            ></textarea>
            <button
                type="button"
                class="rounded-2xl bg-brand px-5 py-3 font-bold text-white shadow disabled:opacity-40"
                :disabled="loading || !draft.trim()"
                @click="sendDraft()"
            >
                Спросить
            </button>
        </div>
    </div>
</section>

<script>
    function tutorChat(config) {
        return {
            open: true,
            loading: false,
            error: "",
            draft: "",
            messages: [],

            async init() {
                try {
                    const res = await fetch(config.url, {
                        headers: { "X-Requested-With": "XMLHttpRequest" },
                    });
                    const data = await res.json();
                    if (data.ok) {
                        this.messages = data.messages || [];
                        this.scroll();
                    }
                } catch (e) {
                    // тихо игнорируем — история подгрузится при первом вопросе
                }
            },

            quick(text) {
                this.send(text);
            },

            sendDraft() {
                const text = this.draft.trim();
                if (!text) return;
                this.draft = "";
                this.send(text);
            },

            async send(text) {
                if (this.loading) return;
                this.error = "";
                this.messages.push({ role: "user", content: text });
                this.scroll();
                this.loading = true;

                try {
                    const res = await fetch(config.url, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "X-CSRFToken": config.csrf,
                            "X-Requested-With": "XMLHttpRequest",
                        },
                        body: JSON.stringify({ message: text }),
                    });
                    const data = await res.json();

                    if (data.ok) {
                        this.messages.push({ role: "assistant", content: data.reply });
                    } else {
                        this.error = data.error || "Что-то пошло не так.";
                    }
                } catch (e) {
                    this.error = "Не удалось связаться с тьютором. Попробуй ещё раз.";
                } finally {
                    this.loading = false;
                    this.scroll();
                }
            },

            scroll() {
                this.$nextTick(() => {
                    const log = this.$refs.log;
                    if (log) log.scrollTop = log.scrollHeight;
                });
            },
        };
    }
</script>
